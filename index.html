      border: none;
      background: transparent;
      color: var(--text-secondary);

      cursor: pointer;
      display: flex;
      align-items: center;

    .tab-button.active {

      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .tier-info div:last-child {
      font-size: 10px;
      color: var(--text-secondary);
    }

      margin-bottom: 6px;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .module-button {

      padding: 12px 14px;
      background: var(--bg-secondary);
      border: none;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .module-button:hover {
      background: var(--border-color);
    }

    .module-button.active {
      background: rgba(42, 157, 143, 0.05);
      border-color: var(--color-teal);
      border: 2px solid var(--color-teal);
    }

    .module-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
      margin-bottom: 3px;
      flex: 1;
    }

    .module-course {
      font-size: 10px;
      font-weight: 600;
    }

    .module-content {
      display: none;
      padding: 2px 10px 10px;
    }

    .module-content.active {
      display: block;
    }

    .module-summary {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 8px 2px;
    }

      margin-bottom: 1px;
    }

      padding: 8px 10px;
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .topic-button:hover {
      background: rgba(42, 157, 143, 0.04);
    }

    .topic-toggle {
      color: var(--text-secondary);
      flex-shrink: 0;
      font-size: 11px;
    }

    .topic-content {
      display: none;
      padding: 2px 10px 8px;
    }

    .topic-content.active {
      display: block;
    }

    .key-point {
      display: flex;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .key-point-bullet {
      flex-shrink: 0;
      margin-top: 1px;
    }

      font-weight: 700;
      background: rgba(42, 157, 143, 0.11);
      border: 1px solid rgba(42, 157, 143, 0.33);
      border-radius: 7px;
      padding: 5px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
      color: var(--color-teal);
    }

    .scenario-button:hover {
      background: rgba(42, 157, 143, 0.2);
    }

    .scenario-box {
      display: none;
      margin-top: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 12px;

    .scenario-box.active {
      display: block;
    }

    .scenario-question {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-primary);
      margin: 0 0 8px 0;
    }

    .scenario-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-button {
      width: 100%;
      padding: 7px 9px;
      margin-bottom: 4px;
      border-radius: 7px;
      border: 1.5px solid var(--border-color);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-primary);
      display: flex;
      gap: 7px;
      align-items: flex-start;
      transition: all 0.15s;

    .option-button:hover:not(.answered) {
      border-color: var(--color-blue);
      background: rgba(69, 123, 157, 0.05);
    }

      font-weight: 700;
      font-size: 10px;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--border-color);
      color: var(--text-secondary);

      background: var(--color-teal);
      color: #fff;
    }

      background: var(--color-red);
      color: #fff;
    }

      background: rgba(42, 157, 143, 0.12);
      border-color: var(--color-teal);
      color: var(--color-teal);
    }

    .option-button.incorrect {
      background: rgba(230, 57, 70, 0.12);
      border-color: var(--color-red);
      color: var(--color-red);
    }

      padding: 7px 9px;
      background: rgba(42, 157, 143, 0.1);
      border: 1px solid rgba(42, 157, 143, 0.33);
      border-radius: 7px;

      font-size: 10px;
      font-weight: 700;
      color: var(--color-teal);
      margin-bottom: 3px;

      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0;

      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);

      margin-bottom: 8px;

      outline: none;

      gap: 3px;
      flex-wrap: wrap;
      margin-bottom: 12px;

      padding: 3px 9px;
      border-radius: 16px;
      border: none;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      transition: all 0.2s;

      background: var(--color-teal);
      color: #fff;
    }

      border-radius: 9px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      margin-bottom: 4px;

      font-weight: 600;
      color: var(--color-teal);
      font-family: 'Courier New', monospace;
      word-break: break-all;

      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.5;
    }

      justify-content: space-between;
      margin-bottom: 10px;
    }

      background: rgba(42, 157, 143, 0.22);
      color: var(--color-teal);
      padding: 2px 8px;
      border-radius: 16px;
      font-size: 10px;
      font-weight: 600;
    }

    .exam-counter {
      font-size: 10px;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border-color);
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--color-teal);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .exam-question {
      font-size: 13px;
      line-height: 1.7;
      font-weight: 500;
      margin-bottom: 14px;
      color: var(--text-primary);
    }

    .submit-button {
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      border: none;
      background: var(--border-color);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 13px;
      cursor: default;
      margin-top: 4px;
      transition: all 0.2s;
    }

    .submit-button:not(:disabled) {
      background: var(--color-teal);
      color: #fff;
      cursor: pointer;
    }

    .submit-button:not(:disabled):hover {
      opacity: 0.9;
    }

    .results-screen {
      text-align: center;
      padding: 20px 0;
    }

    .score-display {
      font-size: 52px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      margin-bottom: 4px;
    }

    .score-info {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .score-status {
      font-size: 14px;
      font-weight: 700;
      margin: 8px 0 20px 0;
    }

    .retake-button {
      padding: 10px 28px;
      border-radius: 9px;
      border: none;
      background: var(--color-teal);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .ref-terms-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>

        { title: "How Claude Processes Text", keyPoints: ["Text is first broken into smaller chunks called tokens before any processing occurs", "Claude generates responses token-by-token, predicting the most likely next token", "Temperature controls randomness: low (0.0) = predictable/factual, high (1.0) = creative/varied", "Context window = total tokens (input + output) the model can handle in one request"], scenario: { question: "You're building a factual Q&A app for medical terminology. Which temperature setting should you use?", options: ["1.0 (very high) for diverse answers", "0.5 (medium) as a balanced default", "Low temperature (near 0.0) for consistent, predictable responses", "Temperature doesn't matter for factual content"], correct: 2, explanation: "Factual Q&A needs deterministic, consistent responses. Low temperature minimizes randomness so the same question produces the same reliable answer." } },

        { title: "Workflow Patterns", keyPoints: ["Chaining: sequential focused steps — fixes 'Claude ignores rules' in long prompts", "Routing: direct to specialized pipelines by content type", "Parallelization: evaluate independent options simultaneously, then compare", "Evaluator-Optimizer: generate → evaluate → improve → loop", "Workflows (predetermined) = reliable, testable; Agents (autonomous) = flexible", "Choose workflows when you can picture the exact flow"], scenario: { question: "Claude keeps ignoring rules in a long prompt with many requirements. What helps?", options: ["Make prompt longer", "Run everything in parallel", "Routing workflow to categorize", "Chain into focused sequential steps"], correct: 3, explanation: "Chaining reduces cognitive load per step — each handles fewer rules for better compliance." } },

    const QUICK_REFERENCE = [
      { term: "stop_reason: \"tool_use\"", def: "Continue agentic loop — execute tool", cat: "API" },
      { term: "stop_reason: \"end_turn\"", def: "Terminate loop — present response", cat: "API" },
      { term: "tool_choice: \"auto\"", def: "May return text OR call tool", cat: "API" },
      { term: "tool_choice: \"any\"", def: "MUST call a tool", cat: "API" },
      { term: "tool_choice: forced", def: "MUST call specific named tool", cat: "API" },
      { term: "Message Batches API", def: "50% savings, ≤24h, no SLA, no multi-turn", cat: "API" },
      { term: "custom_id", def: "Correlate batch req/res; resubmit failures", cat: "API" },
      { term: "-p / --print", def: "Non-interactive CI/CD mode (PREVENTS HANGS)", cat: "CLI" },
      { term: "--output-format json", def: "Structured CLI output for CI", cat: "CLI" },
      { term: "--resume <name>", def: "Continue named session", cat: "CLI" },
      { term: "/compact", def: "Reduce context in long sessions", cat: "CLI" },
      { term: "/memory", def: "Check loaded memory files", cat: "CLI" },
      { term: ".claude/CLAUDE.md", def: "Project config — shared via VCS", cat: "Config" },
      { term: "~/.claude/CLAUDE.md", def: "User config — personal, NOT shared", cat: "Config" },
      { term: ".claude/rules/", def: "Glob-pattern rules (YAML frontmatter)", cat: "Config" },
      { term: "@import", def: "Modular file referencing in CLAUDE.md", cat: "Config" },
      { term: ".claude/commands/", def: "Project slash commands (shared)", cat: "Config" },
      { term: "~/.claude/commands/", def: "User slash commands (personal)", cat: "Config" },
      { term: "context: fork", def: "Skill runs in isolated sub-agent", cat: "Skills" },
      { term: "allowed-tools", def: "Restrict tools during skill execution", cat: "Skills" },
      { term: "argument-hint", def: "Prompt for params if invoked bare", cat: "Skills" },
      { term: ".mcp.json", def: "Project MCP config (VCS, env vars)", cat: "MCP" },
      { term: "~/.claude.json", def: "User MCP config (personal)", cat: "MCP" },
      { term: "isError + errorCategory", def: "Structured MCP error (transient/validation/business/permission)", cat: "MCP" },
      { term: "PostToolUse hook", def: "Normalize results AFTER tool runs", cat: "Hooks" },
      { term: "PreToolUse hook", def: "Block/validate BEFORE tool runs (exit 2=deny)", cat: "Hooks" },
      { term: "fork_session", def: "Branch from shared baseline", cat: "Session" },
      { term: "Task tool", def: "Spawn subagents (needs allowedTools:'Task')", cat: "SDK" },
    ];

    const TIER_META = {
      1: { label: "Foundation", icon: "🏗️", desc: "Core concepts — start here", bg: "#2A9D8F" },
      2: { label: "Intermediate", icon: "⚙️", desc: "Integration & config", bg: "#E9C46A" },
      3: { label: "Advanced", icon: "🚀", desc: "Architecture & orchestration", bg: "#E63946" }
    };

    // STATE
    let examQuestions = [];
    let currentExamQ = 0;
    let examAnswers = {};
    let currentRefCategory = "All";

    // INITIALIZE
    function init() {
      renderStudyGuide();
      renderQuickRef();
      renderExam();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderStudyGuide() {
      let html = '';
      [1, 2, 3].forEach(tier => {
        const meta = TIER_META[tier];
        html += `<div style="margin-bottom: 22px;">
          <div class="tier-header">
            <span class="tier-icon">${meta.icon}</span>
            <div class="tier-info">
              <div style="color: ${meta.bg}">Tier ${tier}: ${meta.label}</div>
              <div>${meta.desc}</div>
            </div>
          </div>`;

        LEARNING_PATH.filter(m => m.tier === tier).forEach(mod => {
          html += `<div class="module" id="mod-${mod.id}">
            <button class="module-button" onclick="toggleModule('${mod.id}')">
              <div>
                <div class="module-title">${mod.title}</div>
                <div class="module-course" style="color: ${mod.color}">${mod.course}</div>
              </div>
              <div style="display: flex; gap: 3px; flex-wrap: wrap;">
                ${mod.examDomains.map(d => `<span style="background: ${mod.color}22; color: ${mod.color}; padding: 2px 6px; border-radius: 5px; font-size: 9px; font-weight: 700; font-family: monospace;">${d}</span>`).join('')}
              </div>
            </button>
            <div class="module-content" id="content-${mod.id}">
              <p class="module-summary">${mod.summary}</p>
              ${mod.topics.map((t, ti) => renderTopic(t, mod.id, ti, mod.color)).join('')}
            </div>
          </div>`;
        });
        html += '</div>';
      });
      document.getElementById('guide').innerHTML = html;
    }

    function renderTopic(topic, modId, topicIdx, color) {
      const topicId = `${modId}-${topicIdx}`;
      let html = `<div class="topic">
        <button class="topic-button" onclick="toggleTopic('${topicId}', '${color}')">
          <span>${topic.title}</span>
          <span class="topic-toggle">+</span>
        </button>
        <div class="topic-content" id="topic-${topicId}">`;

      topic.keyPoints.forEach(pt => {
        html += `<div class="key-point"><span class="key-point-bullet" style="color: ${color}">▸</span><span>${pt}</span></div>`;
      });

      if (topic.scenario) {
        html += `<button class="scenario-button" onclick="toggleScenario('${topicId}')">▶ Try Scenario</button>
          <div class="scenario-box" id="scenario-${topicId}">
            <p class="scenario-question">${topic.scenario.question}</p>
            <div class="scenario-options">
              ${topic.scenario.options.map((o, i) => `
                <button class="option-button" onclick="answerScenario('${topicId}', ${i}, ${topic.scenario.correct})">
                  <span class="option-label">${String.fromCharCode(65 + i)}</span>
                  <span>${o}</span>
                </button>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${topicId}" style="display: none;">
              <div class="explanation-label">✓ Explanation</div>
              <p class="explanation-text">${topic.scenario.explanation}</p>
            </div>
          </div>`;
      }

      html += '</div></div>';
      return html;
    }

    function toggleModule(modId) {
      const btn = document.querySelector(`#mod-${modId} .module-button`);
      const content = document.getElementById(`content-${modId}`);
      btn.classList.toggle('active');
      content.classList.toggle('active');
    }

    function toggleTopic(topicId, color) {
      const btn = document.querySelector(`#topic-${topicId} .topic-button`);
      const content = document.getElementById(`topic-${topicId}`);
      const toggle = btn.querySelector('.topic-toggle');
      btn.style.background = content.classList.contains('active') ? 'transparent' : `${color}08`;
      toggle.textContent = content.classList.contains('active') ? '+' : '−';
      content.classList.toggle('active');
    }

    function toggleScenario(topicId) {
      document.getElementById(`scenario-${topicId}`).classList.toggle('active');
    }

    function answerScenario(topicId, selected, correct) {
      const buttons = document.querySelectorAll(`#scenario-${topicId} .option-button`);
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selected && i !== correct) b.classList.add('incorrect');
      });
      document.getElementById(`exp-${topicId}`).style.display = 'block';
    }

    function renderQuickRef() {
      const cats = ["All", ...new Set(QUICK_REFERENCE.map(r => r.cat))];
      let html = `<input type="text" class="quick-ref-input" id="refSearch" placeholder="Search terms..." onkeyup="filterReferences()">
        <div class="ref-categories">
          ${cats.map(c => `<button class="ref-category-btn ${c === 'All' ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</button>`).join('')}
        </div>
        <div class="ref-terms-list" id="refTerms">`;

      QUICK_REFERENCE.forEach(r => {
        html += `<div class="ref-term" data-cat="${r.cat}" data-search="${(r.term + r.def).toLowerCase()}">
          <div class="ref-term-code">${r.term}</div>
          <div class="ref-term-def">${r.def}</div>
        </div>`;
      });

      html += '</div>';
      document.getElementById('ref').innerHTML = html;
      document.getElementById('refCategories').innerHTML = cats.map(c => `<button class="ref-category-btn ${c === 'All' ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</button>`).join('');
    }

    function filterByCategory(cat) {
      currentRefCategory = cat;
      document.querySelectorAll('.ref-category-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      filterReferences();
    }

    function filterReferences() {
      const search = document.getElementById('refSearch').value.toLowerCase();
      document.querySelectorAll('.ref-term').forEach(el => {
        const matchesCat = currentRefCategory === 'All' || el.dataset.cat === currentRefCategory;
        const matchesSearch = el.dataset.search.includes(search);
        el.style.display = matchesCat && matchesSearch ? 'block' : 'none';
      });
    }

    function renderExam() {
      examQuestions = LEARNING_PATH.flatMap(m => m.topics.filter(t => t.scenario).map(t => ({ ...t.scenario, domain: m.examDomains[0], color: m.color })));
      const shuffled = [...examQuestions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      examQuestions = shuffled;
      renderExamQuestion();
    }

    function renderExamQuestion() {
      if (currentExamQ >= examQuestions.length) {
        renderExamResults();
        return;
      }
      const q = examQuestions[currentExamQ];
      const progress = ((currentExamQ + 1) / examQuestions.length) * 100;
      let html = `
        <div class="exam-progress">
          <span class="exam-domain" style="background: ${q.color}22; color: ${q.color}; padding: 2px 8px;">${q.domain}</span>
          <span class="exam-counter">${currentExamQ + 1}/${examQuestions.length}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%; background: ${q.color};"></div></div>
        <p class="exam-question">${q.question}</p>
        <div class="scenario-options">
          ${q.options.map((o, i) => `
            <button class="option-button" id="opt-${i}" onclick="selectExamOption(${i}, ${q.correct})">
              <span class="option-label">${String.fromCharCode(65 + i)}</span>
              <span>${o}</span>
            </button>
          `).join('')}
        </div>
        <button class="submit-button" id="submitBtn" onclick="submitExam(${q.correct})" disabled>Submit</button>`;
      document.getElementById('exam').innerHTML = html;
    }

    let selectedExamOpt = null;

    function selectExamOption(idx, correct) {
      if (examAnswers[currentExamQ] !== undefined) return;
      selectedExamOpt = idx;
      document.querySelectorAll('.option-button').forEach(b => b.style.borderColor = 'var(--border-color)');
      document.getElementById(`opt-${idx}`).style.borderColor = '#457B9D';
      document.getElementById('submitBtn').disabled = false;
    }

    function submitExam(correct) {
      examAnswers[currentExamQ] = selectedExamOpt === correct;
      const q = examQuestions[currentExamQ];
      const buttons = document.querySelectorAll('.option-button');
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selectedExamOpt && i !== correct) b.classList.add('incorrect');
      });

      const expHtml = `<div class="explanation-box" style="margin-top: 12px;">
        <div class="explanation-label">${selectedExamOpt === correct ? '✓ Correct' : '✗ Incorrect'}</div>
        <p class="explanation-text">${q.explanation}</p>
      </div>`;
      document.querySelector('.scenario-options').insertAdjacentHTML('afterend', expHtml);

      document.getElementById('submitBtn').textContent = 'Next →';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').onclick = () => {
        currentExamQ++;
        selectedExamOpt = null;
        renderExamQuestion();
      };
    }

    function renderExamResults() {
      const correctCount = Object.values(examAnswers).filter(Boolean).length;
      const score = Math.round((correctCount / examQuestions.length) * 1000);
      const status = score >= 900 ? '🎯 TARGET MET' : score >= 720 ? '✅ PASSED' : '❌ BELOW PASSING';
      const statusColor = score >= 900 ? '#2A9D8F' : score >= 720 ? '#E9C46A' : '#E63946';

      document.getElementById('exam').innerHTML = `
        <div class="results-screen">
          <div class="score-display" style="color: ${statusColor};">${score}</div>
          <div class="score-info">out of 1000 · ${correctCount}/${examQuestions.length} correct</div>
          <div class="score-status" style="color: ${statusColor};">${status}</div>
          <button class="retake-button" onclick="retakeExam()">Retake</button>
        </div>`;
    }

    function retakeExam() {
      currentExamQ = 0;
      examAnswers = {};
      renderExam();
    }

    // INIT
    init();
  </script>
</body>
