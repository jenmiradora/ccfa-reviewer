      color: #fff;

    .score-info {

      color: var(--text-secondary);

    .score-status {
      font-size: 11px;
      font-weight: 700;
      margin: 8px 0 20px 0;

    .retake-button {
      padding: 10px 28px;
      border-radius: 9px;
      border: none;
      background: var(--color-teal);
      color: #fff;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }

    .ref-terms-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>

        { title: "How Claude Processes Text", keyPoints: ["Text is first broken into smaller chunks called tokens before any processing occurs", "Claude generates responses token-by-token, predicting the most likely next token", "Temperature controls randomness: low (0.0) = predictable/factual, high (1.0) = creative/varied", "Context window = total tokens (input + output) the model can handle in one request"], scenario: { question: "You're building a factual Q&A app for medical terminology. Which temperature setting should you use?", options: ["1.0 (very high) for diverse answers", "0.5 (medium) as a balanced default", "Low temperature (near 0.0) for consistent, predictable responses", "Temperature doesn't matter for factual content"], correct: 2, explanation: "Factual Q&A needs deterministic, consistent responses. Low temperature minimizes randomness so the same question produces the same reliable answer." } },
        { title: "Conversations & Context", keyPoints: ["Claude is STATELESS via the API — it does NOT remember previous messages between separate requests", "You must send the FULL conversation history in each API request to maintain context", "System prompts define Claude's role, personality, and behavior across the conversation", "Messages array alternates between 'user' and 'assistant' roles to build multi-turn conversations"], scenario: { question: "You ask Claude 'What is pizza?' and it answers. Then you ask 'What toppings are popular?' but Claude doesn't know you're still talking about pizza. What's the problem?", options: ["Claude is broken", "You need to send the whole conversation history with each request", "You asked too quickly", "Claude doesn't like pizza"], correct: 1, explanation: "Claude is stateless. Each API call is independent. You must include all prior messages (user + assistant) in the messages array so Claude has the full context." } },
        { title: "Core Features Overview", keyPoints: ["Extended thinking: produces BOTH a reasoning process and final answer (two parts in response)", "Citations: create a clear trail from Claude's response back to specific parts of source documents", "Prompt caching: reuse same large content across requests — 90% cost savings, min 1024 tokens", "Code execution: runs in isolated Docker container with NO network access", "PDF support: use type: 'document' with media_type: 'application/pdf' (different from images)"], scenario: { question: "You want Claude to analyze a PDF document. What's the main difference from sending an image?", options: ["PDFs cost more to process", "Change type to 'document' and media_type to 'application/pdf'", "You can only send text, not images in PDFs", "PDFs require special permission"], correct: 1, explanation: "PDFs use type: 'document' with media_type: 'application/pdf', while images use type: 'image'. The content type specification is the key structural difference." } }
      ]},
      { id: "foundation-api", tier: 1, course: "Building with the Claude API", title: "API Fundamentals, Prompt Engineering & Evaluation", examDomains: ["D4", "D5"], color: "#457B9D", summary: "API request structure, prompt engineering techniques, structured output with tool_use, prompt evaluation workflows, and batch processing.", topics: [
        { title: "API Request Essentials", keyPoints: ["Four required elements: API key (x-api-key header), model name, messages array, and max_tokens", "API key MUST be stored on your server, NEVER exposed in client-side code", "Response streaming sends tokens incrementally — fixes the 'loading spinner then wall of text' problem", "Prefilled messages + stop sequences = clean JSON output with no extra text"], scenario: { question: "Users complain your chat app feels slow — they wait 20 seconds then all text appears at once. What fixes this?", options: ["Asking shorter questions", "Using a faster internet connection", "Enabling response streaming", "Using a different web browser"], correct: 2, explanation: "Streaming sends tokens incrementally as they're generated. Users see text appearing in real-time instead of waiting for the complete response." } },
        { title: "Prompt Engineering Techniques", keyPoints: ["Be clear and direct: 'Write a product description for running shoes.' beats vague openings", "XML tags (<reviews>, <sales_data>) separate distinct data types in prompts", "Few-shot prompting: provide sample input/output pairs for consistent formatted output", "Few-shot enables model to GENERALIZE to novel patterns, not just match pre-specified cases", "Explicit criteria > vague instructions: 'flag when behavior contradicts code' beats 'check accuracy'"], scenario: { question: "Your code review AI produces inconsistent output. Detailed instructions alone don't fix it. Most effective technique?", options: ["Make the prompt longer with more rules", "Provide 2-4 few-shot examples showing exact desired format", "Lower the temperature to 0", "Use XML tags to structure the prompt"], correct: 1, explanation: "Few-shot examples are the most effective for consistent formatted output when instructions alone fail. They demonstrate exact format and enable generalization." } },

        { title: "Tool Interface Design (EXAM-CRITICAL)", keyPoints: ["Tool descriptions = PRIMARY mechanism LLMs use for selection — minimal descriptions = unreliable routing", "EXAMPLE: 'get_customer' (minimal) vs web_search tool (minimal) both say 'analyze content' → 45% misrouting", "GOOD descriptions include: input formats, example queries, edge cases, boundary explanations, when to use vs similar tools", "Ambiguous/overlapping descriptions cause misrouting (e.g., analyze_content vs analyze_document)", "Too many tools (18+ vs 4-5 focused) DEGRADES selection reliability", "Few-shot examples help but are SECONDARY — fix descriptions FIRST", "Tool renaming eliminates semantic overlap (extract_web_results vs load_document)", "Tool consolidation reduces complexity BUT loses specialization"], scenario: { question: "Agent calls get_customer when users ask 'check my order #1234'. Both tools have minimal descriptions ('Retrieves customer information' / 'Retrieves order details'). Most effective first step?", options: ["Add 5-8 few-shot examples to system prompt", "Expand each tool's description with input formats, examples, edge cases, boundaries", "Implement keyword-based routing classifier", "Consolidate into single lookup tool"], correct: 1, explanation: "Tool descriptions are the PRIMARY selection mechanism. Minimal descriptions leave model unable to distinguish. Expanding descriptions is low-effort, high-leverage fix that addresses root cause directly. Few-shot examples are helpful but secondary." } },

        { title: "Structured Error Responses (MCP)", keyPoints: ["MCP isError flag communicates failures back to agent", "Return: errorCategory (transient/validation/business/permission), isRetryable, description", "Distinguish access failures (retry) from valid empty results (no matches)", "Generic 'Operation failed' PREVENTS intelligent recovery", "Subagents: local recovery for transient; propagate only unresolvable with partial results"], scenario: { question: "Web search subagent times out. Which approach enables intelligent coordinator recovery?", options: ["Structured error context: failure type, query, partial results, alternatives", "Auto-retry then generic 'search unavailable'", "Catch timeout, return empty results as successful", "Terminate entire workflow"], correct: 0, explanation: "Structured error context enables informed recovery decisions. Generic status hides context. Empty success suppresses errors." } },
        { title: "MCP Server Configuration", keyPoints: ["Project-level: .mcp.json (shared, VCS, env var expansion: ${GITHUB_TOKEN})", "User-level: ~/.claude.json (personal/experimental)", "All tools discovered at connection time, available simultaneously", "MCP resources expose content catalogs to reduce exploratory tool calls", "Test with MCP Inspector: mcp dev mcp_server.py"], scenario: { question: "You've built an MCP server. Best way to test tools before connecting to Claude?", options: ["Write test scripts for each tool", "Test manually in terminal", "Use MCP Inspector with mcp dev mcp_server.py", "Connect to Claude first"], correct: 2, explanation: "MCP Inspector is the official browser-based tool for testing MCP servers — interactive UI for listing and executing tools." } }
      ]},
      { id: "intermediate-planning", tier: 2, course: "Smart Execution Strategies", title: "Plan Mode, Direct Execution & Decision Making", examDomains: ["D3", "D5"], color: "#E9C46A", summary: "When to use plan mode (exploration before action) vs direct execution (simple tasks), architectural decisions, complexity assessment, and safe exploration patterns.", topics: [
        { title: "Plan Mode vs Direct Execution (EXAM-CRITICAL)", keyPoints: ["Plan mode: explore codebase, understand dependencies, design BEFORE changes — multi-file changes, architectural decisions, ambiguous requirements", "Direct execution: simple, well-scoped tasks — single validation, one-file fix, clear instructions", "Complexity stated upfront → use plan mode. 'Emerge' during work → direct execution OK.", "Plan mode enables safe exploration BEFORE committing to potentially costly changes", "Plan mode prevents rework from incorrect architectural choices", "Stated in requirements? Use plan mode. Not mentioned but emerges later? Pivot if needed."], scenario: { question: "You're restructuring monolithic application into microservices (dozens of files, service boundaries, module dependencies). Which approach?", options: ["Direct execution with comprehensive upfront instructions", "Direct execution, let implementation reveal boundaries", "Enter plan mode to explore, design, then implement", "Direct execution, switch to plan mode if complexity emerges"], correct: 2, explanation: "Complexity is STATED upfront (architectural restructuring = clear design needs). Plan mode enables safe exploration of dependencies and service boundaries BEFORE committing changes across dozens of files. Prevents costly rework from wrong architectural choices." } },

        { title: "Code Review: Multi-Pass Patterns & Attention Management", keyPoints: ["Single-pass 14-file review: inconsistent depth (some detailed, some superficial), contradictory feedback, missed bugs", "Per-file local passes: consistent depth checking, catches local issues reliably", "Separate integration pass: examines cross-file data flow, dependencies", "Lost-in-the-middle effect: models process beginning/end better than middle sections", "Multi-pass review avoids attention dilution (too many files at once)", "Self-review limitation: same instance retains reasoning, less likely to question own decisions"], scenario: { question: "Single-pass review of 14 files: inconsistent depth, obvious bugs missed, contradicts itself. How to restructure?", options: ["Upgrade to larger context window model", "Per-file local passes then separate integration pass for cross-file", "Run three independent passes, flag issues appearing in 2+ runs", "Require developers to split PRs into 3-4 files"], correct: 1, explanation: "Per-file passes ensure consistent depth. Integration pass handles cross-file concerns. Avoids attention dilution from too many files simultaneously." } },

      { id: "advanced-reliability", tier: 3, course: "Claude Reliability & Architecture", title: "Reliability Engineering, Safety & Architecture Decisions", examDomains: ["D1", "D5"], color: "#6A4C93", summary: "High-yield exam concepts around deterministic enforcement, least privilege, safe automation, validation pipelines, and architecture tradeoffs.", topics: [
        { title: "Deterministic Enforcement: Hooks vs Prompts (EXAM-CRITICAL)", keyPoints: ["Hooks (PreToolUse/PostToolUse) = DETERMINISTIC guarantees — code-level enforcement", "Prompts = PROBABILISTIC — non-zero failure rate always exists", "PreToolUse hook with exit code 2 blocks tool execution BEFORE it happens", "PostToolUse hook normalizes/validates results AFTER execution", "Business-critical rules (payment verification, refund guardrails) need hooks, not prompts", "Use prompts for guidance/suggestions, hooks for 'must happen' requirements", "Exam heavily favors programmatic enforcement over prompt-based guidance"], scenario: { question: "Refund workflow MUST verify get_customer before calling process_refund. In 12% of cases agent skips get_customer. Best fix?", options: ["Enhance system prompt to state verification is mandatory", "Add few-shot examples showing correct verification order", "Implement PreToolUse hook blocking process_refund until get_customer returns verified ID", "Increase model temperature for safer behavior"], correct: 2, explanation: "PreToolUse hook provides DETERMINISTIC guarantee—exit code 2 blocks process_refund execution unless get_customer succeeded. Prompts and examples are probabilistic; agents can still skip verification despite instructions (12% failure rate proves this)." } },
        { title: "Least Privilege & Safe Automation", keyPoints: ["Grant MINIMUM permissions only — each agent gets only tools it needs", "Scoped tools better than giant admin tools (e.g., verify_fact vs full_web_search)", "Allowed-tools restriction prevents unintended tool access", "Approval gates for risky actions (human-in-the-loop)", "Prefer specialized load_document over general-purpose fetch_url", "Constrain capability at interface level > soft guidance via prompts"], scenario: { question: "Document analysis agent has fetch_url tool for loading docs. Logs show it fetches search engine result pages for web searches (should use web search agent). Best fix?", options: ["Filter to block fetch_url calls to search engine domains", "Replace fetch_url with load_document tool that validates URLs point to documents", "Remove fetch_url and route all URL loading through coordinator", "Add prompt instructions to clarify fetch_url is only for documents"], correct: 1, explanation: "Replace with document-specific tool at interface level. This makes undesired behavior impossible (principle of least privilege), vs soft guidance via filters or prompts which can be circumvented." } },
        { title: "Error Propagation & Escalation", keyPoints: ["Structured errors enable intelligent recovery — include errorCategory, isRetryable, description", "Distinguish transient failures (timeout = retry) from valid empty results (0 results = success)", "Return error WITH CONTEXT to coordinator—what was attempted, partial results, recovery options", "Generic 'Operation failed' prevents intelligent recovery decisions", "Local recovery: subagent handles transient errors; escalate only unresolvable issues", "Progressive summarization RISK: important facts (amounts, dates) lost in vague summaries"], scenario: { question: "Web search agent gets 15 papers from academics, '0 results' from industry, 'Connection timeout' from patents. How to propagate for smart recovery?", options: ["Report timeout and '0 results' both as failures", "Distinguish access failures (timeout) from valid empty results; let coordinator decide retry", "Auto-retry timeouts; report as generic 'search unavailable'", "Aggregate as '67% source coverage' with detailed logs"], correct: 1, explanation: "Timeout (access failure, transient, retryable) and '0 results' (valid query result, not an error) are semantically different. Coordinator needs to retry patent DB while accepting industry report as valid/informative finding." } },
        { title: "Context Management: Lost in the Middle", keyPoints: ["Models attend more to beginning and end of context, less to middle — 'lost in the middle' effect", "155K tokens aggregated research: synthesis attends to first 15K and last 10K, misses middle 50K", "SOLUTION: place key findings summary at START + use explicit section headers throughout", "Trim tool outputs BEFORE accumulation (40 fields → 5 relevant fields)", "Persistent case facts block OUTSIDE summarized conversation history", "Upgrade approach: modify upstream agents to return structured data (facts, citations) not verbose content"], scenario: { question: "Synthesis agent with 75K tokens total: reliable on first 15K and last 10K, misses middle 50K findings. How to fix?", options: ["Summarize all outputs to <20K tokens", "Rotate which agent appears first to balance coverage", "Place key findings summary at beginning + explicit section headers", "Stream results sequentially processing one at a time"], correct: 2, explanation: "Primacy effect: critical information in key findings summary at start gets best attention. Section headers help model navigate middle content, mitigating lost-in-the-middle." } }
      ]},
      { id: "prompt-engineering", tier: 2, course: "Structured Output & Prompting Techniques", title: "Few-Shot Examples, Explicit Criteria & Output Formatting", examDomains: ["D4"], color: "#457B9D", summary: "Few-shot prompting for ambiguous scenarios, explicit criteria vs vague instructions, output formatting consistency, validation loops, and when instructions alone aren't enough.", topics: [
        { title: "Few-Shot Examples for Ambiguous Scenarios (EXAM-CRITICAL)", keyPoints: ["Explicit instructions alone are probabilistic—few-shot examples show pattern via demonstration", "EXAMPLE: 'I need refund for order #1234 AND update address for #5678'—agent handles single concerns at 94% accuracy but multi-concern drops to 58%", "Few-shot examples show reasoning for WHY one tool chosen over alternatives in ambiguous cases", "Effective few-shot: 4-6 examples targeting ACTUAL problem scenarios with reasoning", "Ineffective: 10-15 clear examples (doesn't teach edge cases) or abstract rules in descriptions", "Few-shot demonstrates GENERALIZATION—model learns pattern, applies to new cases"], scenario: { question: "Agent handles single concerns at 94% accuracy but multi-concern requests drop to 58% (mixes up parameters, misses concerns). What helps most?", options: ["Add 10-15 examples of clear requests to system prompt", "Add explicit 'use when' guidelines to tool descriptions", "Add 4-6 examples of multi-concern requests with reasoning for tool sequencing", "Reduce model temperature for consistency"], correct: 2, explanation: "Agent already handles individual concerns well—it needs pattern guidance for multi-concern decomposition. Examples targeting actual problem scenarios with reasoning are most effective. 10-15 clear examples miss the edge case; abstract rules less effective than worked examples." } },
        { title: "Explicit Criteria vs Vague Instructions", keyPoints: ["Vague: 'check that comments are accurate and up-to-date' → flags TODO markers and straightforward comments (false positives) while missing outdated behavior descriptions", "Explicit: 'flag comments only when claimed behavior contradicts actual code behavior' → precise definition eliminates false positives and catches actual problems", "Explicit severity criteria with examples: Critical (causes data loss), High (correctness bug), Medium (performance), Low (style)", "Explicit escalation criteria: policy gaps, ambiguous customer matches, contradiction between data sources", "Vague instructions produce inconsistent output; explicit criteria produce reliable classification"], scenario: { question: "Severity ratings inconsistent—'null pointer risk' = critical in some PRs, medium in others. Developers can't trust findings. Best fix?", options: ["Add CLAUDE.md severity mapping with instructions to reference", "Include explicit severity criteria with concrete code examples for each level", "Ask Claude to rate severity relative to other issues in same PR", "Request reasoning for each rating then manually calibrate"], correct: 1, explanation: "Explicit criteria with examples directly removes ambiguity about what each severity level means. This is proven technique for reliable classification vs abstract instructions or manual calibration." } },
        { title: "Output Formatting & Few-Shot Demonstrations", keyPoints: ["Instructions alone for consistent formatting = unreliable (probabilistic)", "Few-shot examples showing exact desired format (issue, location, fix) = reliable demonstration", "Example: Code review feedback 'complex logic' vs detailed 'File: src/allocate.ts, Line 42: nested conditionals exceed 3 levels, suggest extracting inner condition to named function'", "Two-pass (generate → evaluate → improve) adds complexity without solving format inconsistency", "JSON schema prevents SYNTAX errors but not SEMANTIC errors (wrong values still possible)"], scenario: { question: "Reviews identify valid issues but feedback isn't actionable ('complex allocation logic' without specifics). Adding instructions 'always include specific fix suggestions' produces inconsistent output. How to fix?", options: ["Implement two-pass: identify issues then generate fixes separately", "Expand context window for more code understanding", "Add 3-4 few-shot examples showing exact format: issue, location, specific fix", "Further refine instructions with explicit format requirements"], correct: 2, explanation: "Few-shot examples are most effective for consistent formatting when instructions alone fail. Providing 3-4 examples showing exact desired format gives model concrete pattern to follow, more reliable than abstract instructions." } }
      ]},

        { title: "Agentic Loop (EXAM-CRITICAL — 27%)", keyPoints: ["Loop: check stop_reason → 'tool_use' = continue; 'end_turn' = terminate", "Tool results appended to conversation for next-step reasoning", "Model-driven decisions vs pre-configured sequences", "ANTI-PATTERNS: parsing NL for loop end (unreliable), arbitrary loop caps (e.g., max 10 iterations), using text content as completion signal", "stop_reason is the authoritative signal, not natural language parsing", "Tool results always appended to messages array before next API call"], scenario: { question: "You're implementing the agentic loop for your support agent. After each API call to Claude, what determines whether to continue the loop or stop?", options: ["Parse Claude's response text for phrases like 'I've completed' or 'Is there anything else?'", "Check the stop_reason field in Claude's response—continue when 'tool_use', stop when 'end_turn'", "Set a maximum iteration count (e.g., 10 calls) and stop when reached", "Check whether the response includes any assistant text content"], correct: 1, explanation: "The stop_reason field is Claude's explicit structured signal. 'tool_use' means Claude wants to execute a tool and receive results back. 'end_turn' means Claude has completed and the loop should terminate. Never parse NL signals or use arbitrary caps—they're unreliable." } },

usiness/permission) for intelligent handling." }] },

        { question: "What type of attack attempts to override instructions through external content?", options: ["Token drift", "Prompt injection", "Batch poisoning", "Loop collision"], correct: 1, domain: "D5", color: "#6A4C93", explanation: "Prompt injection uses untrusted content to manipulate the model." }

    // STATE
    let examQuestions = [];
    let currentExamQ = 0;
    let examAnswers = {};
    let currentRefCategory = "All";
    let currentTestSetIndex = 0;

    // INITIALIZE
    function init() {
      renderStudyGuide();
      renderQuickRef();
      renderExam();
      renderCertification();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderStudyGuide() {
      let html = '';
      [1, 2, 3].forEach(tier => {
        const meta = TIER_META[tier];
        html += `<div style="margin-bottom: 22px;">
          <div class="tier-header">
            <span class="tier-icon">${meta.icon}</span>
            <div class="tier-info">
              <div style="color: ${meta.bg}">Tier ${tier}: ${meta.label}</div>
              <div>${meta.desc}</div>
            </div>
          </div>`;

        LEARNING_PATH.filter(m => m.tier === tier).forEach(mod => {
          html += `<div class="module" id="mod-${mod.id}">
            <button class="module-button" onclick="toggleModule('${mod.id}')">
              <div>
                <div class="module-title">${mod.title}</div>
                <div class="module-course" style="color: ${mod.color}">${mod.course}</div>
              </div>
              <div style="display: flex; gap: 3px; flex-wrap: wrap;">
                ${mod.examDomains.map(d => `<span style="background: ${mod.color}22; color: ${mod.color}; padding: 2px 6px; border-radius: 5px; font-size: 9px; font-weight: 700; font-family: monospace;">${d}</span>`).join('')}
              </div>
            </button>
            <div class="module-content" id="content-${mod.id}">
              <p class="module-summary">${mod.summary}</p>
              ${mod.topics.map((t, ti) => renderTopic(t, mod.id, ti, mod.color)).join('')}
            </div>
          </div>`;
        });
        html += '</div>';
      });
      document.getElementById('guide').innerHTML = html;
    }

    function renderTopic(topic, modId, topicIdx, color) {
      const topicId = `${modId}-${topicIdx}`;
      let html = `<div class="topic">
        <button class="topic-button" onclick="toggleTopic('${topicId}', '${color}')">
          <span>${topic.title}</span>
          <span class="topic-toggle">+</span>
        </button>
        <div class="topic-content" id="topic-${topicId}">`;

      topic.keyPoints.forEach(pt => {
        html += `<div class="key-point"><span class="key-point-bullet" style="color: ${color}">▸</span><span>${pt}</span></div>`;
      });

      if (topic.scenario) {
        html += `<button class="scenario-button" onclick="toggleScenario('${topicId}')">▶ Try Scenario</button>
          <div class="scenario-box" id="scenario-${topicId}">
            <p class="scenario-question">${topic.scenario.question}</p>
            <div class="scenario-options">
              ${topic.scenario.options.map((o, i) => `
                <button class="option-button" onclick="answerScenario('${topicId}', ${i}, ${topic.scenario.correct})">
                  <span class="option-label">${String.fromCharCode(65 + i)}</span>
                  <span>${o}</span>
                </button>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${topicId}" style="display: none;">
              <div class="explanation-label">✓ Explanation</div>
              <p class="explanation-text">${topic.scenario.explanation}</p>
            </div>
          </div>`;
      }

      html += '</div></div>';
      return html;
    }

    function toggleModule(modId) {
      const btn = document.querySelector(`#mod-${modId} .module-button`);
      const content = document.getElementById(`content-${modId}`);
      if (!btn || !content) {
        console.error(`toggleModule: Could not find module ${modId}`);
        return;
      }
      btn.classList.toggle('active');
      content.classList.toggle('active');
    }

    function toggleTopic(topicId, color) {
      const content = document.getElementById(`topic-${topicId}`);
      if (!content) {
        console.error(`toggleTopic: Could not find topic ${topicId}`);
        return;
      }
      const btn = content.parentElement.querySelector('.topic-button');
      if (!btn) {
        console.error(`toggleTopic: Could not find button for topic ${topicId}`);
        return;
      }
      const toggle = btn.querySelector('.topic-toggle');
      if (!toggle) {
        console.error(`toggleTopic: Could not find toggle for topic ${topicId}`);
        return;
      }
      btn.style.background = content.classList.contains('active') ? 'transparent' : `${color}08`;
      toggle.textContent = content.classList.contains('active') ? '+' : '−';
      content.classList.toggle('active');
    }

    function toggleScenario(topicId) {
      const scenario = document.getElementById(`scenario-${topicId}`);
      if (!scenario) {
        console.error(`toggleScenario: Could not find scenario ${topicId}`);
        return;
      }
      scenario.classList.toggle('active');
    }

    function answerScenario(topicId, selected, correct) {
      const buttons = document.querySelectorAll(`#scenario-${topicId} .option-button`);
      if (!buttons || buttons.length === 0) {
        console.error(`answerScenario: Could not find scenario buttons for ${topicId}`);
        return;
      }
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selected && i !== correct) b.classList.add('incorrect');
      });
      const exp = document.getElementById(`exp-${topicId}`);
      if (exp) {
        exp.style.display = 'block';
      }
    }

    function renderQuickRef() {
      const cats = ["All", ...new Set(QUICK_REFERENCE.map(r => r.cat))];
      let html = `<input type="text" class="quick-ref-input" id="refSearch" placeholder="Search terms..." onkeyup="filterReferences()">
        <div class="ref-categories">
          ${cats.map(c => `<button class="ref-category-btn ${c === 'All' ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</button>`).join('')}
        </div>
        <div class="ref-terms-list" id="refTerms">`;

      QUICK_REFERENCE.forEach(r => {
        html += `<div class="ref-term" data-cat="${r.cat}" data-search="${(r.term + r.def).toLowerCase()}">
          <div class="ref-term-code">${r.term}</div>
          <div class="ref-term-def">${r.def}</div>
        </div>`;
      });

      html += '</div>';
      document.getElementById('ref').innerHTML = html;
    }

    function filterByCategory(cat) {
      currentRefCategory = cat;
      document.querySelectorAll('.ref-category-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      filterReferences();
    }

    function filterReferences() {
      const search = document.getElementById('refSearch').value.toLowerCase();
      document.querySelectorAll('.ref-term').forEach(el => {
        const matchesCat = currentRefCategory === 'All' || el.dataset.cat === currentRefCategory;
        const matchesSearch = el.dataset.search.includes(search);
        el.style.display = matchesCat && matchesSearch ? 'block' : 'none';
      });
    }

    function renderExam() {
      // Use backup test set or original questions
      if (currentTestSetIndex === 0) {
        examQuestions = LEARNING_PATH.flatMap(m => m.topics.filter(t => t.scenario).map(t => ({ ...t.scenario, domain: m.examDomains[0], color: m.color })));
      } else {
        examQuestions = BACKUP_TEST_SETS[currentTestSetIndex - 1].questions;
      }
      
      // Shuffle questions
      const shuffled = [...examQuestions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      examQuestions = shuffled;
      currentExamQ = 0;
      examAnswers = {};
      renderExamQuestion();
    }

    function generateNewTestSet() {
      // Cycle through test sets
      currentTestSetIndex = (currentTestSetIndex + 1) % (BACKUP_TEST_SETS.length + 1);
      const testName = currentTestSetIndex === 0 ? "Original Test Set" : BACKUP_TEST_SETS[currentTestSetIndex - 1].name;
      renderExam();
    }

    function renderExamQuestion() {
      if (currentExamQ >= examQuestions.length) {
        renderExamResults();
        return;
      }
      const q = examQuestions[currentExamQ];
      const progress = ((currentExamQ + 1) / examQuestions.length) * 100;
      const testSetName = currentTestSetIndex === 0 ? "Original Test Set" : BACKUP_TEST_SETS[currentTestSetIndex - 1].name;
      let html = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-size: 11px; font-weight: 600; color: #333333;">${testSetName}</span>
          <button onclick="generateNewTestSet()" style="padding: 5px 12px; border-radius: 6px; border: 1px solid #d0d0d0; background: #f5f5f5; color: #333333; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s;">🔄 Generate New Test</button>
        </div>
        <div class="exam-progress">
          <span class="exam-domain" style="background: ${q.color}22; color: ${q.color}; padding: 2px 8px;">${q.domain}</span>
          <span class="exam-counter">${currentExamQ + 1}/${examQuestions.length}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%; background: ${q.color};"></div></div>
        <p class="exam-question">${q.question}</p>
        <div class="scenario-options">
          ${q.options.map((o, i) => `
            <button class="option-button" id="opt-${i}" onclick="selectExamOption(${i}, ${q.correct})">
              <span class="option-label">${String.fromCharCode(65 + i)}</span>
              <span>${o}</span>
            </button>
          `).join('')}
        </div>
        <button class="submit-button" id="submitBtn" onclick="submitExam(${q.correct})" disabled>Submit</button>`;
      document.getElementById('exam').innerHTML = html;
    }

    let selectedExamOpt = null;

    function selectExamOption(idx, correct) {
      if (examAnswers[currentExamQ] !== undefined) return;
      selectedExamOpt = idx;
      document.querySelectorAll('.option-button').forEach(b => b.style.borderColor = 'var(--border-color)');
      document.getElementById(`opt-${idx}`).style.borderColor = '#457B9D';
      document.getElementById('submitBtn').disabled = false;
    }

    function generateIncorrectExplanation(question, correctAnswer, option, optionIndex) {
      // Analyze the incorrect option to provide meaningful feedback
      const correctOpt = question.options[correctAnswer];
      
      // Context-aware explanations based on common wrong answer patterns
      const patterns = {
        opposite: (opt) => opt && correctOpt && opt.includes('NOT') !== correctOpt.includes('NOT'),
        tooSpecific: (opt) => opt && opt.length < 30,
        tooBroad: (opt) => opt && opt.includes('All') || opt.includes('any'),
        misconception: true
      };
      
      // Generate explanation based on the option content
      let feedback = '';
      
      if (option.toLowerCase().includes('all') || option.toLowerCase().includes('every')) {
        feedback = "This is too absolute/broad. The correct answer is more specific or nuanced.";
      } else if (option.toLowerCase().includes('never') || option.toLowerCase().includes("doesn't")) {
        feedback = "This negates something that is actually true. Check the opposite statement.";
      } else if (option.length < 30) {
        feedback = "This is too simplified and misses important context or requirements.";
      } else if (option.includes('same') || option.includes('identical')) {
        feedback = "These appear similar but have important differences in how they work or when they apply.";
      } else if (optionIndex < correctAnswer) {
        feedback = "While partially correct, this option doesn't fully address what the question is asking.";
      } else {
        feedback = "This sounds plausible but contradicts the established behavior or best practice.";
      }
      
      return feedback;
    }

    function submitExam(correct) {
      examAnswers[currentExamQ] = selectedExamOpt === correct;
      const q = examQuestions[currentExamQ];
      const buttons = document.querySelectorAll('.option-button');
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selectedExamOpt && i !== correct) b.classList.add('incorrect');
      });

      // Build comprehensive explanation with feedback for all choices
      let expHtml = `<div class="explanation-box" style="margin-top: 12px; background: #ffffff; border-radius: 6px; padding: 12px; border: 1px solid #d0d0d0;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <span style="font-size: 18px; font-weight: 700;">${selectedExamOpt === correct ? '✓' : '✗'}</span>
          <div>
            <div class="explanation-label" style="margin: 0; font-size: 13px;">${selectedExamOpt === correct ? 'Correct! ' : 'Incorrect. '}You selected: <strong>${String.fromCharCode(65 + selectedExamOpt)}</strong></div>
          </div>
        </div>
        
        <div style="margin-bottom: 12px; padding: 10px; background: #2A9D8F22; border-left: 4px solid #2A9D8F; border-radius: 4px;">
          <div style="font-weight: 700; color: #2A9D8F; margin-bottom: 6px; font-size: 12px;">✓ Correct Answer (${String.fromCharCode(65 + correct)})</div>
          <div style="font-weight: 600; color: #000000; font-size: 12px; margin-bottom: 6px;">${q.options[correct]}</div>
          <p class="explanation-text" style="margin: 0; color: #000000; font-size: 12px; line-height: 1.5;">${q.explanation}</p>
        </div>
        
        <div style="margin-bottom: 12px;">
          <div style="font-weight: 700; color: #333333; margin-bottom: 8px; font-size: 12px;">Why Other Answers Are Incorrect:</div>
          ${q.options.map((opt, i) => {
            if (i === correct) return '';
            
            const isSelected = i === selectedExamOpt;
            const bgColor = isSelected ? '#E6394633' : '#f5f5f5';
            const borderColor = isSelected ? '#E63946' : '#d0d0d0';
            const selectedMark = isSelected ? '<span style="color: #E63946; font-weight: 700; margin-right: 6px;">✗ Your choice:</span>' : '';
            const feedback = generateIncorrectExplanation(q, correct, opt, i);
            
            return `
              <div style="padding: 10px; background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 4px; margin-bottom: 8px;">
                <div style="font-weight: 600; color: #333333; font-size: 12px; margin-bottom: 6px;">${selectedMark}${String.fromCharCode(65 + i)}: ${opt}</div>
                <div style="color: #555555; font-size: 11px; line-height: 1.4;">→ ${feedback}</div>
              </div>`;
          }).join('')}
        </div>
        
        <div style="padding: 10px; background: #457B9D22; border-left: 4px solid #457B9D; border-radius: 4px;">
          <div style="font-weight: 700; color: #457B9D; margin-bottom: 6px; font-size: 12px;">📚 Key Learning Point:</div>
          <p class="explanation-text" style="margin: 0; font-size: 11px; color: #000000; line-height: 1.5;">When multiple answers seem plausible, focus on finding the option that directly addresses the specific requirement or behavior described in the question, not just something that's generally true.</p>
        </div>
      </div>`;
      
      document.getElementById('exam').querySelector('.scenario-options').insertAdjacentHTML('afterend', expHtml);

      document.getElementById('submitBtn').textContent = 'Next →';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').onclick = () => {
        currentExamQ++;
        selectedExamOpt = null;
        renderExamQuestion();
      };
    }

    function renderExamResults() {
      const correctCount = Object.values(examAnswers).filter(Boolean).length;
      const score = Math.round((correctCount / examQuestions.length) * 1000);
      const status = score >= 900 ? '🎯 TARGET MET' : score >= 720 ? '✅ PASSED' : '❌ BELOW PASSING';
      const statusColor = score >= 900 ? '#2A9D8F' : score >= 720 ? '#E9C46A' : '#E63946';

      document.getElementById('exam').innerHTML = `
        <div class="results-screen">
          <div class="score-display" style="color: ${statusColor};">${score}</div>
          <div class="score-info">out of 1000 · ${correctCount}/${examQuestions.length} correct</div>
          <div class="score-status" style="color: ${statusColor};">${status}</div>
          <button class="retake-button" onclick="retakeExam()">Retake</button>
        </div>`;
    }

    function retakeExam() {
      currentTestSetIndex = 0;
      currentExamQ = 0;
      examAnswers = {};
      renderExam();
