      color: #fff;

    .ref-terms-list {

      flex-direction: column;
      gap: 4px;
    }

      { name: "Test Set 8", questions: [{ question: "What is the correct way to reference a memory file in Claude Code?", options: ["/memory command shows loaded files", "No way to verify", "Check .env", "Manual inspection"], correct: 0, domain: "D3", color: "#E76F51", explanation: "Use /memory command to verify which memory files Claude Code has loaded into the session." }, { question: "How should you structure context for multi-pass reviews?", options: ["Single pass is always best", "Per-file local passes + cross-file integration pass", "Three passes of the entire codebase", "No structure needed"], correct: 1, domain: "D1", color: "#E63946", explanation: "Per-file local passes ensure consistent depth. Integration pass catches cross-file issues. Avoids attention dilution." }, { question: "What type of error should be retried in structured MCP responses?", options: ["All errors should be retried", "Only transient errors marked isRetryable: true", "Business logic errors", "Permission errors"], correct: 1, domain: "D2", color: "#E9C46A", explanation: "Transient (network) errors are retryable. Business/validation/permission errors are not - don't retry them." }, { question: "What is a key characteristic of custom slash commands?", options: ["Only available to the user", "Project-scoped commands shared via VCS", "Can't be customized", "Limited to one per project"], correct: 1, domain: "D3", color: "#E76F51", explanation: "Project-scoped commands in .claude/commands/ are version-controlled and available to all team members." }, { question: "When using few-shot prompting, what is the main benefit over instructions alone?", options: ["Instructions are always sufficient", "Few-shot enables generalization to novel patterns", "Few-shot is slower", "No real difference"], correct: 1, domain: "D4", color: "#457B9D", explanation: "Few-shot demonstrates format by example, enabling models to generalize to cases not explicitly covered." }] },

      { name: "Test Set 10", questions: [{ question: "How does code execution work in Claude?", options: ["Runs on Claude's servers", "Runs in isolated Docker container with NO network", "Requires internet access", "Executed client-side"], correct: 1, domain: "D4", color: "#457B9D", explanation: "Code execution is sandboxed in isolated Docker with no network access. Maximum security/isolation." }, { question: "When should you use fresh sessions with summaries vs. resuming sessions?", options: ["Always resume", "Stale tool results → fresh session + summary. Changed files → fresh session", "Never resume", "Always fresh"], correct: 1, domain: "D3", color: "#E76F51", explanation: "If files changed overnight, tool results are stale. Fresh session with injected summary is more reliable than resume." }, { question: "What's the key to enabling intelligent recovery in multi-agent systems?", options: ["Ignoring errors silently", "Structured error context: category, type, partial results", "Generic error messages", "No error handling"], correct: 1, domain: "D1", color: "#E63946", explanation: "Structured errors + context enable informed recovery decisions. Generic 'failed' prevents intelligent handling." }, { question: "Why might you choose routing over parallelization?", options: ["Routing is always faster", "Different content types need different pipelines; parallelization inappropriate", "Parallelization never works", "They're identical"], correct: 1, domain: "D1", color: "#E63946", explanation: "Routing directs content to specialized pipelines. Parallelization evaluates independent options simultaneously. Different patterns." }, { question: "What does isError flag indicate in MCP?", options: ["Network connectivity issue", "Successful tool execution", "Tool encountered error - check errorCategory for type", "Data format problem"], correct: 2, domain: "D2", color: "#E9C46A", explanation: "isError: true signals failure. errorCategory tells you the TYPE (transient/validation/business/permission) for intelligent handling." }] },
      { name: "Test Set 11", questions: [{ question: "What is the most reliable way to get consistent JSON output?", options: ["Temperature = 0 with instructions", "tool_use with JSON schemas (prevents syntax errors)", "Regex post-processing", "Random selection"], correct: 1, domain: "D4", color: "#457B9D", explanation: "tool_use eliminates syntax errors. Semantic errors (wrong values) still possible, but format guaranteed." }, { question: "How should new team members get coding conventions?", options: ["Verbal explanation", "Project-level .claude/CLAUDE.md (shared via VCS)", "Individual ~/.claude/CLAUDE.md files", "No way to share"], correct: 1, domain: "D3", color: "#E76F51", explanation: "Project-level config is shared via VCS. User-level configs are personal and NOT shared with the team." }, { question: "What's the primary purpose of MCP?", options: ["Replace the API", "Provide context + tools WITHOUT tedious integration", "Database management", "Security enforcement"], correct: 1, domain: "D2", color: "#E9C46A", explanation: "MCP = communication layer that provides context and tools with minimal integration overhead." }, { question: "When is PreToolUse hook execution blocked?", options: ["Never", "With exit code 2 → execution prevented", "Only for Read tool", "Only for Grep"], correct: 1, domain: "D3", color: "#E76F51", explanation: "PreToolUse with exit code 2 blocks the tool from executing. Perfect for permission checks before sensitive operations." }, { question: "What's the main limitation of batch processing API?", options: ["No cost savings", "Up to 24h delay + no latency SLA = unsuitable for blocking tasks", "Limited to 10 requests", "No tool use support"], correct: 1, domain: "D4", color: "#457B9D", explanation: "Batch = 50% savings + 24h window but NO latency guarantee. Perfect for overnight reports, not pre-merge checks." }] }
    ];

    // STATE
    let examQuestions = [];
    let currentExamQ = 0;
    let examAnswers = {};
    let currentRefCategory = "All";
    let currentTestSetIndex = 0;

    // INITIALIZE
    function init() {
      renderStudyGuide();
      renderQuickRef();
      renderExam();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderStudyGuide() {
      let html = '';
      [1, 2, 3].forEach(tier => {
        const meta = TIER_META[tier];
        html += `<div style="margin-bottom: 22px;">
          <div class="tier-header">
            <span class="tier-icon">${meta.icon}</span>
            <div class="tier-info">
              <div style="color: ${meta.bg}">Tier ${tier}: ${meta.label}</div>
              <div>${meta.desc}</div>
            </div>
          </div>`;

        LEARNING_PATH.filter(m => m.tier === tier).forEach(mod => {
          html += `<div class="module" id="mod-${mod.id}">
            <button class="module-button" onclick="toggleModule('${mod.id}')">
              <div>
                <div class="module-title">${mod.title}</div>
                <div class="module-course" style="color: ${mod.color}">${mod.course}</div>
              </div>
              <div style="display: flex; gap: 3px; flex-wrap: wrap;">
                ${mod.examDomains.map(d => `<span style="background: ${mod.color}22; color: ${mod.color}; padding: 2px 6px; border-radius: 5px; font-size: 9px; font-weight: 700; font-family: monospace;">${d}</span>`).join('')}
              </div>
            </button>
            <div class="module-content" id="content-${mod.id}">
              <p class="module-summary">${mod.summary}</p>
              ${mod.topics.map((t, ti) => renderTopic(t, mod.id, ti, mod.color)).join('')}
            </div>
          </div>`;
        });
        html += '</div>';
      });
      document.getElementById('guide').innerHTML = html;
    }

    function renderTopic(topic, modId, topicIdx, color) {
      const topicId = `${modId}-${topicIdx}`;
      let html = `<div class="topic">
        <button class="topic-button" onclick="toggleTopic('${topicId}', '${color}')">
          <span>${topic.title}</span>
          <span class="topic-toggle">+</span>
        </button>
        <div class="topic-content" id="topic-${topicId}">`;

      topic.keyPoints.forEach(pt => {
        html += `<div class="key-point"><span class="key-point-bullet" style="color: ${color}">▸</span><span>${pt}</span></div>`;
      });

      if (topic.scenario) {
        html += `<button class="scenario-button" onclick="toggleScenario('${topicId}')">▶ Try Scenario</button>
          <div class="scenario-box" id="scenario-${topicId}">
            <p class="scenario-question">${topic.scenario.question}</p>
            <div class="scenario-options">
              ${topic.scenario.options.map((o, i) => `
                <button class="option-button" onclick="answerScenario('${topicId}', ${i}, ${topic.scenario.correct})">
                  <span class="option-label">${String.fromCharCode(65 + i)}</span>
                  <span>${o}</span>
                </button>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${topicId}" style="display: none;">
              <div class="explanation-label">✓ Explanation</div>
              <p class="explanation-text">${topic.scenario.explanation}</p>
            </div>
          </div>`;
      }

      html += '</div></div>';
      return html;
    }

    function toggleModule(modId) {
      const btn = document.querySelector(`#mod-${modId} .module-button`);
      const content = document.getElementById(`content-${modId}`);
      btn.classList.toggle('active');
      content.classList.toggle('active');
    }

    function toggleTopic(topicId, color) {
      const content = document.getElementById(`topic-${topicId}`);
      const btn = content.parentElement.querySelector('.topic-button');
      const toggle = btn.querySelector('.topic-toggle');
      btn.style.background = content.classList.contains('active') ? 'transparent' : `${color}08`;
      toggle.textContent = content.classList.contains('active') ? '+' : '−';
      content.classList.toggle('active');
    }

    function toggleScenario(topicId) {
      document.getElementById(`scenario-${topicId}`).classList.toggle('active');
    }

    function answerScenario(topicId, selected, correct) {
      const buttons = document.querySelectorAll(`#scenario-${topicId} .option-button`);
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selected && i !== correct) b.classList.add('incorrect');
      });
      document.getElementById(`exp-${topicId}`).style.display = 'block';
    }

    function renderQuickRef() {
      const cats = ["All", ...new Set(QUICK_REFERENCE.map(r => r.cat))];
      let html = `<input type="text" class="quick-ref-input" id="refSearch" placeholder="Search terms..." onkeyup="filterReferences()">
        <div class="ref-categories">
          ${cats.map(c => `<button class="ref-category-btn ${c === 'All' ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</button>`).join('')}
        </div>
        <div class="ref-terms-list" id="refTerms">`;

      QUICK_REFERENCE.forEach(r => {
        html += `<div class="ref-term" data-cat="${r.cat}" data-search="${(r.term + r.def).toLowerCase()}">
          <div class="ref-term-code">${r.term}</div>
          <div class="ref-term-def">${r.def}</div>
        </div>`;
      });

      html += '</div>';
      document.getElementById('ref').innerHTML = html;
    }

    function filterByCategory(cat) {
      currentRefCategory = cat;
      document.querySelectorAll('.ref-category-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      filterReferences();
    }

    function filterReferences() {
      const search = document.getElementById('refSearch').value.toLowerCase();
      document.querySelectorAll('.ref-term').forEach(el => {
        const matchesCat = currentRefCategory === 'All' || el.dataset.cat === currentRefCategory;
        const matchesSearch = el.dataset.search.includes(search);
        el.style.display = matchesCat && matchesSearch ? 'block' : 'none';
      });
    }

    function renderExam() {
      // Use backup test set or original questions
      if (currentTestSetIndex === 0) {
        examQuestions = LEARNING_PATH.flatMap(m => m.topics.filter(t => t.scenario).map(t => ({ ...t.scenario, domain: m.examDomains[0], color: m.color })));
      } else {
        examQuestions = BACKUP_TEST_SETS[currentTestSetIndex - 1].questions;
      }
      
      // Shuffle questions
      const shuffled = [...examQuestions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      examQuestions = shuffled;
      currentExamQ = 0;
      examAnswers = {};
      renderExamQuestion();
    }

    function generateNewTestSet() {
      // Cycle through test sets
      currentTestSetIndex = (currentTestSetIndex + 1) % (BACKUP_TEST_SETS.length + 1);
      const testName = currentTestSetIndex === 0 ? "Original Test Set" : BACKUP_TEST_SETS[currentTestSetIndex - 1].name;
      renderExam();
    }

    function renderExamQuestion() {
      if (currentExamQ >= examQuestions.length) {
        renderExamResults();
        return;
      }
      const q = examQuestions[currentExamQ];
      const progress = ((currentExamQ + 1) / examQuestions.length) * 100;
      const testSetName = currentTestSetIndex === 0 ? "Original Test Set" : BACKUP_TEST_SETS[currentTestSetIndex - 1].name;
      let html = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-size: 11px; font-weight: 600; color: #333333;">${testSetName}</span>
          <button onclick="generateNewTestSet()" style="padding: 5px 12px; border-radius: 6px; border: 1px solid #d0d0d0; background: #f5f5f5; color: #333333; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s;">🔄 Generate New Test</button>
        </div>
        <div class="exam-progress">
          <span class="exam-domain" style="background: ${q.color}22; color: ${q.color}; padding: 2px 8px;">${q.domain}</span>
          <span class="exam-counter">${currentExamQ + 1}/${examQuestions.length}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%; background: ${q.color};"></div></div>
        <p class="exam-question">${q.question}</p>
        <div class="scenario-options">
          ${q.options.map((o, i) => `
            <button class="option-button" id="opt-${i}" onclick="selectExamOption(${i}, ${q.correct})">
              <span class="option-label">${String.fromCharCode(65 + i)}</span>
              <span>${o}</span>
            </button>
          `).join('')}
        </div>
        <button class="submit-button" id="submitBtn" onclick="submitExam(${q.correct})" disabled>Submit</button>`;
      document.getElementById('exam').innerHTML = html;
    }

    let selectedExamOpt = null;

    function selectExamOption(idx, correct) {
      if (examAnswers[currentExamQ] !== undefined) return;
      selectedExamOpt = idx;
      document.querySelectorAll('.option-button').forEach(b => b.style.borderColor = 'var(--border-color)');
      document.getElementById(`opt-${idx}`).style.borderColor = '#457B9D';
      document.getElementById('submitBtn').disabled = false;
    }

    function generateIncorrectExplanation(question, correctAnswer, option, optionIndex) {
      // Analyze the incorrect option to provide meaningful feedback
      const correctOpt = question.options[correctAnswer];
      
      // Context-aware explanations based on common wrong answer patterns
      const patterns = {
        opposite: (opt) => opt && correctOpt && opt.includes('NOT') !== correctOpt.includes('NOT'),
        tooSpecific: (opt) => opt && opt.length < 30,
        tooBroad: (opt) => opt && opt.includes('All') || opt.includes('any'),
        misconception: true
      };
      
      // Generate explanation based on the option content
      let feedback = '';
      
      if (option.toLowerCase().includes('all') || option.toLowerCase().includes('every')) {
        feedback = "This is too absolute/broad. The correct answer is more specific or nuanced.";
      } else if (option.toLowerCase().includes('never') || option.toLowerCase().includes("doesn't")) {
        feedback = "This negates something that is actually true. Check the opposite statement.";
      } else if (option.length < 30) {
        feedback = "This is too simplified and misses important context or requirements.";
      } else if (option.includes('same') || option.includes('identical')) {
        feedback = "These appear similar but have important differences in how they work or when they apply.";
      } else if (optionIndex < correctAnswer) {
        feedback = "While partially correct, this option doesn't fully address what the question is asking.";
      } else {
        feedback = "This sounds plausible but contradicts the established behavior or best practice.";
      }
      
      return feedback;
    }

    function submitExam(correct) {
      examAnswers[currentExamQ] = selectedExamOpt === correct;
      const q = examQuestions[currentExamQ];
      const buttons = document.querySelectorAll('.option-button');
      buttons.forEach((b, i) => {
        b.classList.remove('correct', 'incorrect');
        if (i === correct) b.classList.add('correct');
        else if (i === selectedExamOpt && i !== correct) b.classList.add('incorrect');
      });

      // Build comprehensive explanation with feedback for all choices
      let expHtml = `<div class="explanation-box" style="margin-top: 12px; background: #ffffff; border-radius: 6px; padding: 12px; border: 1px solid #d0d0d0;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <span style="font-size: 18px; font-weight: 700;">${selectedExamOpt === correct ? '✓' : '✗'}</span>
          <div>
            <div class="explanation-label" style="margin: 0; font-size: 13px;">${selectedExamOpt === correct ? 'Correct! ' : 'Incorrect. '}You selected: <strong>${String.fromCharCode(65 + selectedExamOpt)}</strong></div>
          </div>
        </div>
        
        <div style="margin-bottom: 12px; padding: 10px; background: #2A9D8F22; border-left: 4px solid #2A9D8F; border-radius: 4px;">
          <div style="font-weight: 700; color: #2A9D8F; margin-bottom: 6px; font-size: 12px;">✓ Correct Answer (${String.fromCharCode(65 + correct)})</div>
          <div style="font-weight: 600; color: #000000; font-size: 12px; margin-bottom: 6px;">${q.options[correct]}</div>
          <p class="explanation-text" style="margin: 0; color: #000000; font-size: 12px; line-height: 1.5;">${q.explanation}</p>
        </div>
        
        <div style="margin-bottom: 12px;">
          <div style="font-weight: 700; color: #333333; margin-bottom: 8px; font-size: 12px;">Why Other Answers Are Incorrect:</div>
          ${q.options.map((opt, i) => {
            if (i === correct) return '';
            
            const isSelected = i === selectedExamOpt;
            const bgColor = isSelected ? '#E6394633' : '#f5f5f5';
            const borderColor = isSelected ? '#E63946' : '#d0d0d0';
            const selectedMark = isSelected ? '<span style="color: #E63946; font-weight: 700; margin-right: 6px;">✗ Your choice:</span>' : '';
            const feedback = generateIncorrectExplanation(q, correct, opt, i);
            
            return `
              <div style="padding: 10px; background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 4px; margin-bottom: 8px;">
                <div style="font-weight: 600; color: #333333; font-size: 12px; margin-bottom: 6px;">${selectedMark}${String.fromCharCode(65 + i)}: ${opt}</div>
                <div style="color: #555555; font-size: 11px; line-height: 1.4;">→ ${feedback}</div>
              </div>`;
          }).join('')}
        </div>
        
        <div style="padding: 10px; background: #457B9D22; border-left: 4px solid #457B9D; border-radius: 4px;">
          <div style="font-weight: 700; color: #457B9D; margin-bottom: 6px; font-size: 12px;">📚 Key Learning Point:</div>
          <p class="explanation-text" style="margin: 0; font-size: 11px; color: #000000; line-height: 1.5;">When multiple answers seem plausible, focus on finding the option that directly addresses the specific requirement or behavior described in the question, not just something that's generally true.</p>
        </div>
      </div>`;
      
      document.getElementById('exam').querySelector('.scenario-options').insertAdjacentHTML('afterend', expHtml);

      document.getElementById('submitBtn').textContent = 'Next →';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').onclick = () => {
        currentExamQ++;
        selectedExamOpt = null;
        renderExamQuestion();
      };
    }

    function renderExamResults() {
      const correctCount = Object.values(examAnswers).filter(Boolean).length;
      const score = Math.round((correctCount / examQuestions.length) * 1000);
      const status = score >= 900 ? '🎯 TARGET MET' : score >= 720 ? '✅ PASSED' : '❌ BELOW PASSING';
      const statusColor = score >= 900 ? '#2A9D8F' : score >= 720 ? '#E9C46A' : '#E63946';

      document.getElementById('exam').innerHTML = `
        <div class="results-screen">
          <div class="score-display" style="color: ${statusColor};">${score}</div>
          <div class="score-info">out of 1000 · ${correctCount}/${examQuestions.length} correct</div>
          <div class="score-status" style="color: ${statusColor};">${status}</div>
          <button class="retake-button" onclick="retakeExam()">Retake</button>
        </div>`;
    }

    function retakeExam() {
      currentTestSetIndex = 0;
      currentExamQ = 0;
      examAnswers = {};
      renderExam();
    }

    // INIT
    init();
  </script>
</body>
</html>
